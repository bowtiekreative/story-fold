[workspace]
members = ["packages/storyfold-core", "apps/rust-server", "apps/rust-desktop"]
exclude = ["catalyst-solo/boilerplate"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
regex = "1"
storyfold-core = { path = "packages/storyfold-core" }

[profile.dev]
debug = 1
