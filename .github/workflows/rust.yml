name: Rust desktop and runtime
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Linux desktop and media libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lld ffmpeg
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked
      - name: Exercise Rust media API
        if: runner.os == 'Linux'
        shell: bash
        run: |
          temporary_data=$(mktemp -d)
          target/release/storyfold-server --data "$temporary_data" > /tmp/storyfold-rust.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4311/api/health; then break; fi
            sleep 1
          done
          python3 scripts/rust-smoke.py
